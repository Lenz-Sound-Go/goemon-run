
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ゴエモン — Shadow of the Demon Castle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#090b18;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #touch{position:fixed;inset:0;pointer-events:none}
  .pad,.act{position:absolute;bottom:18px;display:flex;gap:12px;pointer-events:auto}
  .pad{left:18px}.act{right:18px}
  button{
    width:64px;height:64px;border-radius:18px;border:2px solid rgba(255,255,255,.35);
    background:linear-gradient(#ffffff30,#00000040);color:white;font-size:25px;font-weight:900;
    text-shadow:0 2px #000;box-shadow:0 8px 0 #0007, inset 0 0 18px #fff2;
    backdrop-filter:blur(4px);touch-action:none
  }
  button:active{transform:translateY(5px);box-shadow:0 3px 0 #0008,inset 0 0 24px #fff4}
  .wide{width:78px}
  @media (hover:hover) and (pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch">
  <div class="pad">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="act">
    <button data-k="jump" class="wide">跳</button>
    <button data-k="chain" class="wide">⛓</button>
    <button data-k="pipe" class="wide">管</button>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha:false });
ctx.imageSmoothingEnabled = false;

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=false;
  groundY=H-50;
}
addEventListener("resize",resize);

let groundY=H-50; resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const AABB=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const keys={left:false,right:false,jump:false};
let state="title", levelIndex=0, cameraX=0, shake=0, hitStop=0, fade=1, fadeDir=-1, time=0;
let score=0, scoreShown=0, combo=0, comboTimer=0, lives=3;
let particles=[], ambient=[], enemies=[], pickups=[], attacks=[];
let bossKilled=false;

const LEVELS=[
  {
    name:"壱 Edo Village",
    jp:"江戸の里",
    len:3000,
    sky:["#ffb48a","#ffd9a1","#8fd6ff"],
    far:"#8a9cc7", mid:"#556f91", ground:"#3c2b25",
    mood:"petal",
    enemies:[
      ["ninja",620],["ninja",900],["samurai",1280],["ninja",1580],["samurai",2050],["ninja",2500]
    ],
    pickups:[[460,"coin"],[520,"coin"],[1120,"heart"],[1720,"coin"],[1780,"coin"],[2300,"coin"]]
  },
  {
    name:"弐 Bamboo Shrine",
    jp:"竹林の社",
    len:3400,
    sky:["#92e4c5","#d7ffd7","#fff0b2"],
    far:"#7ca67d", mid:"#335f4b", ground:"#243820",
    mood:"leaf",
    enemies:[
      ["ninja",540],["samurai",870],["ninja",1180],["oni",1540],["samurai",1940],["ninja",2260],["oni",2750]
    ],
    pickups:[[380,"coin"],[760,"coin"],[1350,"heart"],[1880,"coin"],[2400,"heart"],[3020,"coin"]]
  },
  {
    name:"参 Demon Castle",
    jp:"鬼ヶ城",
    len:3800,
    sky:["#080919","#14102e","#421a42"],
    far:"#313257", mid:"#22162d", ground:"#20151d",
    mood:"firefly",
    enemies:[
      ["ninja",500],["samurai",820],["oni",1240],["ninja",1620],["samurai",2020],["oni",2420],["boss",3200]
    ],
    pickups:[[420,"coin"],[980,"heart"],[1480,"coin"],[2120,"coin"],[2720,"heart"]]
  }
];

const player={
  x:90,y:0,w:34,h:58,vx:0,vy:0,dir:1,onGround:false,
  hp:100,hpShown:100,maxHp:100,inv:0,walk:0,attack:"",atkTimer:0,pipeCd:0,chainCd:0,
  landing:false
};
player.y=groundY-player.h;

function resetLevel(){
  const L=LEVELS[levelIndex];
  cameraX=0; bossKilled=false;
  player.x=80; player.y=groundY-player.h; player.vx=player.vy=0; player.hp=player.maxHp; player.hpShown=player.hp;
  enemies=L.enemies.map(e=>makeEnemy(e[0],e[1]));
  pickups=L.pickups.map(p=>({x:p[0],y:groundY-78,w:18,h:18,type:p[1],taken:false,t:rand(0,10)}));
  particles=[]; attacks=[]; ambient=[];
  for(let i=0;i<90;i++) ambient.push(makeAmbient(true));
  fade=1; fadeDir=-1; state="play";
}
function makeEnemy(type,x){
  const stats={
    ninja:{hp:35,w:30,h:50,spd:96,dmg:9,score:120},
    samurai:{hp:70,w:38,h:56,spd:55,dmg:15,score:230},
    oni:{hp:120,w:48,h:66,spd:42,dmg:22,score:420},
    boss:{hp:420,w:96,h:128,spd:30,dmg:28,score:2500}
  }[type];
  return {type,x,y:groundY-stats.h,w:stats.w,h:stats.h,vx:0,vy:0,dir:-1,hp:stats.hp,maxHp:stats.hp,
    spd:stats.spd,dmg:stats.dmg,score:stats.score,hurt:0,dead:false,atkCd:rand(.2,1.2),walk:0};
}
function makeAmbient(init=false){
  const L=LEVELS[levelIndex]||LEVELS[0];
  return {x:(init?rand(0,W):rand(W,W+80)),y:rand(20,H-70),vx:L.mood==="firefly"?rand(-8,8):rand(-32,-12),
    vy:L.mood==="petal"?rand(10,25):L.mood==="leaf"?rand(18,35):rand(-8,8),
    r:rand(1,3),a:rand(.35,1),t:rand(0,99)};
}
function addParticle(x,y,type,n=1){
  for(let i=0;i<n;i++){
    const colors={
      dust:["#d7ba7d","#9e7448","#fff1bf"],
      blood:["#ff2f56","#b40035","#ffb0bd"],
      spark:["#fff178","#ff9b28","#fff"],
      coin:["#fff27a","#ffd33d","#fff8bd"],
      leaf:["#ffbdd1","#ff87aa","#fff1f7"]
    }[type]||["#fff"];
    particles.push({x,y,vx:rand(-80,80),vy:rand(-150,40),g:rand(280,520),life:rand(.25,.75),max:0,
      s:rand(2,5),c:colors[(Math.random()*colors.length)|0],type});
    particles[particles.length-1].max=particles[particles.length-1].life;
  }
}

function startGame(){levelIndex=0;score=0;scoreShown=0;combo=0;lives=3;resetLevel();}
function nextLevel(){
  levelIndex++;
  if(levelIndex>=LEVELS.length){state="victory";fade=0;return;}
  resetLevel();
}
function damagePlayer(dmg,fromX){
  if(player.inv>0||state!=="play")return;
  player.hp-=dmg; player.inv=1.1; player.vx=(player.x<fromX?-1:1)*260; player.vy=-170;
  shake=12; hitStop=.07; addParticle(player.x+player.w/2,player.y+20,"blood",14);
  if(player.hp<=0){
    lives--;
    if(lives>0){player.hp=player.maxHp; player.x=Math.max(70,player.x-260); player.y=groundY-player.h; fade=1; fadeDir=-1;}
    else {state="gameover";fade=0;}
  }
}
function killEnemy(e){
  e.dead=true; score += e.score * Math.max(1,combo); combo++; comboTimer=2.2;
  addParticle(e.x+e.w/2,e.y+e.h/2,"coin",18);
  for(let i=0;i<3+(e.type==="boss"?18:0);i++) pickups.push({x:e.x+rand(-12,e.w+12),y:e.y+rand(10,e.h-10),w:16,h:16,type:"coin",taken:false,t:rand(0,5)});
  if(e.type==="boss"){bossKilled=true; shake=24; fadeDir=0;}
}
function hitEnemy(e,dmg,kx){
  if(e.dead)return;
  e.hp-=dmg; e.hurt=.22; e.x+=kx; shake=Math.max(shake,5); hitStop=.045;
  addParticle(e.x+e.w/2,e.y+e.h/2,"blood",12);
  addParticle(e.x+e.w/2,e.y+e.h/2,"spark",8);
  if(e.hp<=0) killEnemy(e);
}
function pipeAttack(){
  if(state==="title"){startGame();return}
  if(state!=="play"||player.pipeCd>0)return;
  player.attack="pipe"; player.atkTimer=.22; player.pipeCd=.34;
  const box={x:player.dir>0?player.x+24:player.x-38,y:player.y+12,w:48,h:34};
  addParticle(box.x+box.w/2,box.y+14,"spark",10);
  enemies.forEach(e=>{if(!e.dead&&AABB(box,e))hitEnemy(e,28,player.dir*18)});
}
function chainAttack(){
  if(state==="title"){startGame();return}
  if(state!=="play"||player.chainCd>0)return;
  player.attack="chain"; player.atkTimer=.36; player.chainCd=.72;
  const box={x:player.dir>0?player.x+18:player.x-118,y:player.y+2,w:132,h:38};
  attacks.push({x1:player.x+player.w/2,y1:player.y+24,x2:player.x+player.w/2+player.dir*124,y2:player.y+14,t:.22});
  enemies.forEach(e=>{if(!e.dead&&AABB(box,e))hitEnemy(e,18,player.dir*8)});
}

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="a"||k==="arrowleft")keys.left=true;
  if(k==="d"||k==="arrowright")keys.right=true;
  if(k==="w"||k==="arrowup"||k===" "){keys.jump=true;jump();}
  if(k==="j")pipeAttack();
  if(k==="k")chainAttack();
  if(k==="enter"&&state==="title")startGame();
  if((state==="gameover"||state==="victory")&&k==="enter")startGame();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="a"||k==="arrowleft")keys.left=false;
  if(k==="d"||k==="arrowright")keys.right=false;
  if(k==="w"||k==="arrowup"||k===" ")keys.jump=false;
});
function jump(){
  if(state==="title"){startGame();return}
  if(player.onGround&&state==="play"){player.vy=-390;player.onGround=false;addParticle(player.x+player.w/2,groundY,"dust",12);}
}
document.querySelectorAll("button").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault(); b.setPointerCapture(e.pointerId);
    if(k==="left")keys.left=true; if(k==="right")keys.right=true; if(k==="jump")jump(); if(k==="pipe")pipeAttack(); if(k==="chain")chainAttack();
  });
  b.addEventListener("pointerup",e=>{e.preventDefault(); if(k==="left")keys.left=false; if(k==="right")keys.right=false;});
  b.addEventListener("pointercancel",()=>{if(k==="left")keys.left=false;if(k==="right")keys.right=false;});
});
canvas.addEventListener("pointerdown",()=>{if(state==="title")startGame(); if(state==="gameover"||state==="victory")startGame();});

function update(dt){
  time+=dt;
  if(fadeDir<0)fade=Math.max(0,fade-dt*1.7);
  if(fadeDir>0){fade=Math.min(1,fade+dt*1.5); if(fade>=1){fadeDir=-1;nextLevel();}}
  if(state!=="play"){
    ambient.forEach(a=>ambientStep(a,dt));
    particlesStep(dt); scoreShown=lerp(scoreShown,score,.08); return;
  }
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}
  player.pipeCd=Math.max(0,player.pipeCd-dt); player.chainCd=Math.max(0,player.chainCd-dt);
  player.inv=Math.max(0,player.inv-dt); player.atkTimer=Math.max(0,player.atkTimer-dt);
  if(player.atkTimer<=0)player.attack="";
  const ax=(keys.right?1:0)-(keys.left?1:0);
  player.vx=lerp(player.vx,ax*190,player.onGround?.25:.08);
  if(ax)player.dir=ax;
  player.vy+=850*dt;
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  player.x=clamp(player.x,20,LEVELS[levelIndex].len-player.w-20);
  if(player.y+player.h>=groundY){
    if(!player.onGround&&player.vy>180)addParticle(player.x+player.w/2,groundY,"dust",18);
    player.y=groundY-player.h; player.vy=0; player.onGround=true;
  } else player.onGround=false;
  if(Math.abs(player.vx)>10&&player.onGround)player.walk+=dt*10;

  enemies.forEach(e=>{
    if(e.dead)return;
    e.hurt=Math.max(0,e.hurt-dt); e.atkCd-=dt;
    const dx=(player.x+player.w/2)-(e.x+e.w/2), dist=Math.abs(dx);
    if(dist<520){ e.dir=dx>0?1:-1; e.vx=e.dir*e.spd*(dist<55?.25:1); }
    else e.vx=Math.sin(time+e.x)*e.spd*.25;
    e.x+=e.vx*dt; e.walk+=Math.abs(e.vx)*dt*.08;
    e.x=clamp(e.x,40,LEVELS[levelIndex].len-e.w-40);
    if(AABB(player,e)&&e.atkCd<=0){damagePlayer(e.dmg,e.x); e.atkCd=e.type==="ninja"?.7:e.type==="boss"?1.1:1.25;}
  });

  pickups.forEach(p=>{
    if(p.taken)return; p.t+=dt;
    const box={x:p.x,y:p.y+Math.sin(p.t*4)*4,w:p.w,h:p.h};
    if(AABB(player,box)){
      p.taken=true; addParticle(p.x+p.w/2,p.y+p.h/2,p.type==="coin"?"coin":"spark",16);
      if(p.type==="heart")player.hp=clamp(player.hp+35,0,player.maxHp);
      else {score+=50*Math.max(1,combo||1); combo++; comboTimer=1.5;}
    }
  });

  attacks.forEach(a=>a.t-=dt); attacks=attacks.filter(a=>a.t>0);
  cameraX=clamp(lerp(cameraX,player.x-W*.42,.08),0,Math.max(0,LEVELS[levelIndex].len-W));
  if(player.x>LEVELS[levelIndex].len-120){
    if(levelIndex<2 || bossKilled) fadeDir=1;
  }
  ambient.forEach(a=>ambientStep(a,dt));
  particlesStep(dt);
  player.hpShown=lerp(player.hpShown,player.hp,.12); scoreShown=lerp(scoreShown,score,.1);
  shake=Math.max(0,shake-dt*28);
}
function ambientStep(a,dt){
  const L=LEVELS[levelIndex]||LEVELS[0]; a.t+=dt;
  if(L.mood==="firefly"){a.x+=Math.sin(a.t*2)*18*dt+a.vx*dt; a.y+=Math.cos(a.t*1.7)*12*dt+a.vy*dt;}
  else {a.x+=a.vx*dt; a.y+=(a.vy+Math.sin(a.t*4)*12)*dt;}
  if(a.x<-80||a.y>H+40||a.y<-40)Object.assign(a,makeAmbient(false));
}
function particlesStep(dt){
  particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;});
  particles=particles.filter(p=>p.life>0);
}

function pRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function glowLine(x1,y1,x2,y2,c,w){
  ctx.save(); ctx.lineCap="round";
  for(let i=4;i>0;i--){ctx.strokeStyle=c;ctx.globalAlpha=.08*i;ctx.lineWidth=w+i*4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  ctx.globalAlpha=1;ctx.strokeStyle="#fff7b0";ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function draw(){
  ctx.save();
  const sx=shake?rand(-shake,shake):0, sy=shake?rand(-shake,shake):0;
  ctx.translate(sx,sy);
  drawBackground();
  ctx.translate(-cameraX,0);
  drawWorld();
  pickups.forEach(drawPickup);
  enemies.forEach(drawEnemy);
  drawPlayer();
  attacks.forEach(a=>glowLine(a.x1,a.y1,a.x2,a.y2,"#5efcff",3));
  particles.forEach(drawParticle);
  ctx.restore();
  drawUI();
  if(state==="title")drawTitle();
  if(state==="gameover")drawEnd(false);
  if(state==="victory")drawEnd(true);
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W,H);}
}
function drawBackground(){
  const L=LEVELS[levelIndex]||LEVELS[0];
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,L.sky[0]);g.addColorStop(.55,L.sky[1]);g.addColorStop(1,L.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-(cameraX*.08)%W,0);
  for(let i=-1;i<3;i++)drawCloud(i*W+100,70+Math.sin(time+i)*14,1.1);
  ctx.restore();

  ctx.save(); ctx.translate(-cameraX*.18,0);
  for(let x=-300;x<LEVELS[levelIndex].len+800;x+=260){
    ctx.fillStyle=L.far; ctx.beginPath();
    ctx.moveTo(x,H-70);ctx.lineTo(x+130,H-210-randStable(x)*60);ctx.lineTo(x+280,H-70);ctx.fill();
    ctx.fillStyle="#ffffff55"; ctx.beginPath();
    ctx.moveTo(x+130,H-210-randStable(x)*60);ctx.lineTo(x+92,H-145);ctx.lineTo(x+150,H-165);ctx.fill();
  }
  ctx.restore();

  ctx.save(); ctx.translate(-cameraX*.42,0);
  for(let x=-200;x<LEVELS[levelIndex].len+600;x+=170){
    if(levelIndex===1)drawBamboo(x,H-58,L.mid);
    else if(levelIndex===2)drawCastleSil(x,H-65,L.mid);
    else drawEdoHouse(x,H-56,L.mid);
  }
  ctx.restore();

  ambient.forEach(a=>{
    const L=LEVELS[levelIndex];
    if(L.mood==="firefly"){
      ctx.save();ctx.globalAlpha=.55+.35*Math.sin(a.t*6);ctx.fillStyle="#dfff74";ctx.shadowColor="#dfff74";ctx.shadowBlur=10;
      ctx.fillRect(a.x,a.y,3,3);ctx.restore();
    }else if(L.mood==="petal"){
      ctx.fillStyle=`rgba(255,190,215,${a.a})`;ctx.fillRect(a.x,a.y,a.r*3,a.r*2);
    }else{
      ctx.fillStyle=`rgba(198,122,56,${a.a})`;ctx.fillRect(a.x,a.y,a.r*4,a.r*2);
    }
  });
}
function randStable(x){return (Math.sin(x*12.9898)*43758.5453)%1;}
function drawCloud(x,y,s){
  ctx.fillStyle="rgba(255,255,255,.72)";
  [[0,10,42,14],[20,0,52,22],[58,8,58,17],[100,14,35,10]].forEach(r=>ctx.fillRect(x+r[0]*s,y+r[1]*s,r[2]*s,r[3]*s));
}
function drawEdoHouse(x,y,c){
  pRect(x,y-46,112,46,"#7a4a32"); pRect(x-10,y-58,132,16,"#2d2834"); pRect(x+8,y-37,28,37,"#301d19");
  pRect(x+50,y-34,46,22,"#ffe0a255"); pRect(x+55,y-31,4,16,c); pRect(x+72,y-31,4,16,c); pRect(x+89,y-31,4,16,c);
}
function drawBamboo(x,y,c){
  for(let i=0;i<5;i++){let bx=x+i*24; pRect(bx,y-150-randStable(bx)*40,7,155+randStable(bx)*25,c);
    for(let yy=y-135;yy<y-20;yy+=25)pRect(bx-2,yy,11,2,"#96d071");
    pRect(bx+4,y-120,28,5,"#5da55c"); pRect(bx-26,y-86,30,5,"#5da55c");
  }
}
function drawCastleSil(x,y,c){
  pRect(x+20,y-110,80,110,c); pRect(x,y-124,120,18,"#130d1a"); pRect(x+34,y-168,52,58,c); pRect(x+22,y-180,76,16,"#130d1a");
  pRect(x+47,y-210,26,38,c); pRect(x+35,y-220,50,14,"#130d1a"); pRect(x+48,y-72,16,28,"#ff7b2d66");
}
function drawWorld(){
  const L=LEVELS[levelIndex];
  pRect(-100,groundY,LEVELS[levelIndex].len+300,H-groundY,L.ground);
  pRect(-100,groundY,LEVELS[levelIndex].len+300,8,"#5f4634");
  for(let x=-50;x<LEVELS[levelIndex].len+80;x+=40){
    pRect(x,groundY+8,24,4,"#00000030");
    if(levelIndex===0){pRect(x+8,groundY-8,4,8,"#6cb35d");}
    if(levelIndex===1){pRect(x+5,groundY-18,28,5,"#679d3e");}
    if(levelIndex===2&&x%160===0){pRect(x,groundY-40,8,40,"#2b1b25");pRect(x-6,groundY-46,20,8,"#ff702844");}
  }
  pRect(LEVELS[levelIndex].len-80,groundY-110,8,110,"#f0d68a");
  pRect(LEVELS[levelIndex].len-120,groundY-114,86,10,"#f0d68a");
  pRect(LEVELS[levelIndex].len-108,groundY-90,62,8,"#e54b4b");
}
function drawPickup(p){
  if(p.taken)return;
  const y=p.y+Math.sin(p.t*5)*5;
  ctx.save(); ctx.translate(p.x,p.y);
  if(p.type==="heart"){
    ctx.shadowColor="#ff4777";ctx.shadowBlur=12;
    pRect(2,6,6,6,"#ff4777");pRect(10,6,6,6,"#ff4777");pRect(0,12,18,6,"#ff4777");pRect(4,18,10,5,"#ff93aa");pRect(7,23,4,4,"#ff93aa");
  }else{
    ctx.shadowColor="#ffd84d";ctx.shadowBlur=10;
    ctx.translate(0,Math.sin(p.t*4)*4);pRect(2,2,14,14,"#b87617");pRect(4,0,10,18,"#ffd84d");pRect(7,4,4,10,"#fff1a0");
  }
  ctx.restore();
}
function drawParticle(p){
  ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.c;
  ctx.fillRect(p.x,p.y,p.s,p.s); ctx.globalAlpha=1;
}

function drawPlayer(){
  drawGoemon(player.x+player.w/2,player.y+player.h,player.dir,player);
}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawGoemon(x,y,dir,o){
  const s=3, bob=o.onGround?Math.sin(time*7)*1.5:0, walk=Math.sin(o.walk);
  ctx.save(); ctx.translate(Math.round(x),Math.round(y+bob)); ctx.scale(dir*s,s);
  if(o.inv>0&&Math.floor(time*18)%2===0)ctx.globalAlpha=.45;
  if(o.attack==="chain"){ctx.shadowColor="#5efcff";ctx.shadowBlur=8;}
  if(o.attack==="pipe"){ctx.shadowColor="#ffdd55";ctx.shadowBlur=8;}
  const jump=!o.onGround, atk=o.atkTimer>0;
  // legs
  px(-7,-7,5,7,"#142f5e"); px(3,-7,5,7,"#142f5e");
  if(!jump){px(-7,-2+walk*1.5,5,3,"#1d1b25");px(3,-2-walk*1.5,5,3,"#1d1b25");}
  else {px(-9,-9,5,4,"#1d1b25");px(4,-11,5,4,"#1d1b25");}
  // torso kimono
  px(-8,-24,17,18,"#2467b2"); px(-6,-23,5,17,"#3a8ee2"); px(1,-23,3,17,"#102748"); px(-8,-13,17,3,"#f0c24b");
  // arms
  if(atk&&o.attack==="pipe"){px(7,-22,9,4,"#f0c2a0");px(14,-24,10,2,"#ffdf69");px(18,-27,3,5,"#c97a2d");}
  else if(atk&&o.attack==="chain"){px(7,-23,8,4,"#f0c2a0");}
  else {px(-12,-22,5,13,"#2467b2");px(8,-22,5,13,"#2467b2");px(9,-10,4,3,"#f0c2a0");}
  // neck/head
  px(-4,-28,8,5,"#e8ad86"); px(-8,-40,17,14,"#f0c2a0");
  px(-9,-39,19,4,"#e22b3c"); px(7,-38,7,3,"#e22b3c"); px(10,-35,5,3,"#b41827");
  px(-5,-42,12,4,"#17151d"); px(-9,-36,4,7,"#17151d"); px(6,-36,4,7,"#17151d");
  px(2,-34,2,2,"#101010"); px(-7,-31,12,2,"#a3422c"); px(-2,-29,5,2,"#fff0d0");
  // topknot
  px(-2,-47,5,5,"#17151d"); px(2,-49,5,3,"#17151d");
  // weapon on back
  px(-11,-27,2,22,"#7b4d2a"); px(-13,-29,6,3,"#b7b7bc");
  ctx.restore();
}
function drawEnemy(e){
  if(e.dead)return;
  const s=e.type==="boss"?3.2:3, x=e.x+e.w/2, y=e.y+e.h, dir=e.dir;
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); ctx.scale(dir*s,s);
  if(e.hurt>0){ctx.globalAlpha=.75;ctx.shadowColor="#ff3355";ctx.shadowBlur=12;}
  const w=Math.sin(e.walk*6);
  if(e.type==="ninja"){
    px(-6,-7,4,7,"#151722");px(2,-7,4,7,"#151722");px(-7,-22,14,16,"#25283a");px(-9,-19,4,11,"#25283a");px(7,-19,4,11,"#25283a");
    px(-7,-34,14,12,"#191b26");px(-6,-31,12,3,"#7036c7");px(1,-29,2,2,"#fff");px(5,-29,2,2,"#fff");
    px(8,-20,9,2,"#c7cbd4");px(16,-23,3,5,"#c7cbd4");px(-6,-2+w,4,2,"#111");px(2,-2-w,4,2,"#111");
  } else if(e.type==="samurai"){
    px(-8,-8,5,8,"#2b2230");px(3,-8,5,8,"#2b2230");px(-10,-27,20,20,"#7a2630");px(-12,-25,24,4,"#d6a13d");
    px(-9,-40,18,13,"#d8aa83");px(-11,-43,22,6,"#30333e");px(-13,-47,26,4,"#30333e");px(-4,-35,2,2,"#111");px(4,-35,2,2,"#111");
    px(8,-24,12,3,"#d9dde5");px(18,-26,6,2,"#fff");
  } else if(e.type==="oni"){
    px(-10,-9,7,9,"#47244e");px(4,-9,7,9,"#47244e");px(-13,-31,26,23,"#8d3158");px(-17,-28,7,13,"#8d3158");px(10,-28,7,13,"#8d3158");
    px(-12,-47,24,17,"#bd4a70");px(-8,-51,4,7,"#fff1bf");px(5,-51,4,7,"#fff1bf");px(-7,-41,3,3,"#ffe36e");px(5,-41,3,3,"#ffe36e");px(-5,-34,10,3,"#2b0d17");
    px(12,-25,10,4,"#4b2a1c");px(20,-29,5,12,"#6d3b22");
  } else {
    ctx.shadowColor="#e345ff";ctx.shadowBlur=18;
    px(-18,-14,12,14,"#201122");px(6,-14,12,14,"#201122");px(-25,-62,50,48,"#4a164a");px(-31,-55,12,28,"#6d2262");px(19,-55,12,28,"#6d2262");
    px(-20,-90,40,30,"#8a255d");px(-16,-101,8,14,"#fff2b8");px(8,-101,8,14,"#fff2b8");px(-10,-80,5,5,"#ffe36e");px(7,-80,5,5,"#ffe36e");px(-8,-68,16,4,"#190711");
    px(18,-48,20,7,"#3d2222");px(35,-56,8,24,"#7c3f2c");
  }
  ctx.restore();
  // enemy HP
  if(e.hp<e.maxHp){
    ctx.fillStyle="#240812";ctx.fillRect(e.x,e.y-10,e.w,5);
    ctx.fillStyle=e.type==="boss"?"#d93cff":"#ff3155";ctx.fillRect(e.x,e.y-10,e.w*(e.hp/e.maxHp),5);
  }
}

function drawUI(){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(14,14,250,62);
  ctx.strokeStyle="#ffd976";ctx.lineWidth=2;ctx.strokeRect(14,14,250,62);
  ctx.fillStyle="#240812";ctx.fillRect(30,32,170,16);
  const hpw=170*(player.hpShown/player.maxHp);
  const grd=ctx.createLinearGradient(30,0,200,0);grd.addColorStop(0,"#ff3155");grd.addColorStop(1,"#ffd05b");
  ctx.fillStyle=grd;ctx.fillRect(30,32,hpw,16);ctx.fillStyle="#fff7c7";ctx.fillRect(30,32,hpw,3);
  ctx.fillStyle="#fff";ctx.font="bold 13px monospace";ctx.fillText("ゴエモン",30,28);
  ctx.fillText("命 × "+lives,210,46);
  ctx.fillStyle="#ffe889";ctx.font="bold 20px monospace";ctx.fillText(String(Math.round(scoreShown)).padStart(7,"0"),W-170,34);
  if(combo>1&&comboTimer>0){ctx.fillStyle="#ff7bd5";ctx.font="bold 22px monospace";ctx.fillText(combo+" COMBO!",W/2-60,54);}
  ctx.fillStyle="#fff";ctx.font="bold 14px monospace";ctx.fillText(LEVELS[levelIndex]?.name||"",30,68);
  ctx.restore();
}
function drawTitle(){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#ffdf75";ctx.font="900 52px serif";ctx.shadowColor="#e83cff";ctx.shadowBlur=18;
  ctx.fillText("ゴエモン",W/2,H*.34);
  ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="bold 22px monospace";
  ctx.fillText("Shadow of the Demon Castle",W/2,H*.34+38);
  ctx.fillStyle="#bffcff";ctx.font="16px monospace";
  ctx.fillText("A/D move  W jump  J pipe  K kusarigama",W/2,H*.55);
  ctx.fillText("Tap / Enter to begin",W/2,H*.63);
  drawGoemon(W/2,H*.78,1,{onGround:true,walk:time,attack:Math.sin(time*3)>0?"chain":"",atkTimer:1,inv:0});
  ctx.restore();
}
function drawEnd(win){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.62)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.shadowColor=win?"#ffe86a":"#ff3155";ctx.shadowBlur=18;
  ctx.fillStyle=win?"#fff199":"#ff4b6e";ctx.font="900 48px serif";
  ctx.fillText(win?"大勝利!":"GAME OVER",W/2,H*.42+Math.sin(time*4)*5);
  ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="bold 20px monospace";
  ctx.fillText("Score "+Math.round(scoreShown),W/2,H*.54);
  ctx.fillText("Press Enter / Tap to restart",W/2,H*.64);
  ctx.restore();
}

let last=performance.now();
function loop(now){
  let dt=Math.min(.033,(now-last)/1000); last=now;
  if(hitStop>0){hitStop-=dt; draw(); requestAnimationFrame(loop); return;}
  update(dt); draw(); requestAnimationFrame(loop);
}
resetLevel(); state="title"; fade=0;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
